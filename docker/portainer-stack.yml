# Stack Portainer d'AyLabs : le site public + le Content Studio, tirés de GHCR.
#
# Portainer > Stacks > Add stack > Web editor, puis coller ce fichier et remplir
# l'onglet « Environment variables » — les secrets restent dans Portainer, il n'y
# a pas de .env à maintenir en SSH.
#
# Les images sont publiées par les workflows GitHub :
#   deploy.yml                → aylabs-site
#   content-studio-image.yml  → aylabs-content-studio
#
# Les ports sont publiés sur toutes les interfaces (et non sur 127.0.0.1) : un
# reverse proxy qui tourne lui-même dans un conteneur ne peut pas joindre la
# boucle locale de l'hôte, il n'atteindrait jamais ces services. Le pare-feu du
# serveur reste responsable de fermer 8080/8081 depuis l'extérieur.

services:
  # ── Site public ────────────────────────────────────────────────────────────
  site:
    image: ghcr.io/aymericlefeyer/aylabs-site:latest
    container_name: aylabs-site
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8080:80"

  # ── Content Studio ─────────────────────────────────────────────────────────
  content-studio:
    image: ghcr.io/aymericlefeyer/aylabs-content-studio:latest
    container_name: aylabs-content-studio
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8081:8080"
    environment:
      # APP_URL est l'URL PUBLIQUE servie par le reverse proxy (https://…, sans
      # slash final) : elle sert de callback OAuth et décide du flag Secure des
      # cookies. Une valeur fausse casse la connexion GitHub.
      APP_URL: ${APP_URL:?URL publique du Studio, sans slash final}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Client ID de l OAuth App GitHub}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Client secret de l OAuth App GitHub}
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -base64 48}
      GITHUB_REPO: ${GITHUB_REPO:-AymericLeFeyer/aylabs}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
