server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /domadoo {
        return 301 https://domadoo.fr/fr/?domid=79;
    }

    # Aynalytics : /_ay/* est relayé au collector (conteneur aynalytics-collector sur le
    # réseau Docker partagé « pangolin »). Le navigateur ne voit que aylabs.fr : pas de
    # domaine tiers, moins de blocage par les bloqueurs de pub.
    location /_ay/ {
        # Résolution DNS Docker à la requête (et non au démarrage) : nginx démarre même si
        # le collector est arrêté ; /_ay/ répond alors 502 sans casser le site.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aynalytics http://aynalytics-collector:8080;
        rewrite ^/_ay/(.*)$ /$1 break;
        proxy_pass $aynalytics;

        # IP réelle du visiteur (géolocalisation, rate limit) : on complète la chaîne
        # X-Forwarded-For posée par Traefik/Pangolin, le collector la remonte.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `expires` seul (et non add_header) : un add_header dans un location
    # annulerait les en-têtes de sécurité hérités du bloc server.

    # Les assets Vite portent un hash dans leur nom : cache long.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Instantané des stats de chaîne : il change souvent, jamais figé.
    location = /youtube-stats.json {
        expires -1;
    }

    # Flux des fiches vidéo (vite/videosFeedPlugin.ts), lu par le linktree : jamais figé.
    location = /videos-feed.json {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(jpe?g|png|webp|gif|svg|ico|avif|mp4)$ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Durcissement minimal
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
