server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `expires` seul (et non add_header) : un add_header dans un location
    # annulerait les en-têtes de sécurité hérités du bloc server.

    # Les assets Vite portent un hash dans leur nom : cache long.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Instantané des stats de chaîne : il change souvent, jamais figé.
    location = /youtube-stats.json {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.(jpe?g|png|webp|gif|svg|ico|avif|mp4)$ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Durcissement minimal
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
