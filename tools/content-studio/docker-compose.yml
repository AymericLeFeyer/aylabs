# Compose du Content Studio seul, avec son bloc `build:` pour reconstruire
# depuis les sources (le contexte est la racine du dépôt) :
#   docker compose -f tools/content-studio/docker-compose.yml up -d --build
#
# Pour le déploiement serveur, voir docker/portainer-stack.yml à la racine.

services:
  content-studio:
    image: ghcr.io/aymericlefeyer/aylabs-content-studio:latest
    build:
      context: ../..
      dockerfile: tools/content-studio/Dockerfile
    container_name: aylabs-content-studio
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # URL publique servie par le reverse proxy, sans slash final : callback
      # OAuth et flag Secure des cookies en dépendent.
      APP_URL: ${APP_URL:?URL publique, sans slash final}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Client ID de l OAuth App GitHub}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Client secret de l OAuth App GitHub}
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -base64 48}
      GITHUB_REPO: ${GITHUB_REPO:-AymericLeFeyer/aylabs}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
