name: Build aylabs-fetcher image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/aylabs-fetcher/**"
      - ".github/workflows/aylabs-fetcher-image.yml"

concurrency:
  group: aylabs-fetcher-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🧪 Typecheck and test
        working-directory: tools/aylabs-fetcher
        run: |
          npm ci
          npm run typecheck
          npm test

      # GHCR n'accepte que des noms d'image en minuscules.
      - name: 🔤 Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aylabs-fetcher" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
          labels: |
            org.opencontainers.image.title=AyLabs Fetcher
            org.opencontainers.image.description=Statistiques YouTube de la chaîne AyLabs

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/aylabs-fetcher
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
