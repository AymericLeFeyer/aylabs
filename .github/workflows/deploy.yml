name: Build & publish site image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Le Studio a son propre workflow : inutile de reconstruire le site.
      - "tools/content-studio/**"

concurrency:
  group: site-image
  cancel-in-progress: true

jobs:
  # Image Docker du site, publiée sur GHCR et déployée depuis Portainer.
  docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules.
      - name: 🔤 Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aylabs-site" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
          labels: |
            org.opencontainers.image.title=AyLabs
            org.opencontainers.image.description=Site vitrine de la chaîne AyLabs

      # Les VITE_* sont inlinées dans le bundle au build : elles doivent être
      # passées ici, pas au démarrage du conteneur.
      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_GA_ID=${{ secrets.VITE_GA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Summary
        run: |
          {
            echo "### Image publiée"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:latest"
            echo '```'
            echo ""
            echo "Tags :"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Discord Notification (Success)
        run: |
          curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"🐳 Nouvelle image du site publiée : \`${{ steps.image.outputs.name }}:latest\` — à tirer depuis Portainer.\"}" \
              ${{ secrets.DISCORD_WEBHOOK }}

      - name: 💬 Discord Notification (Failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
              -X POST \
              -d "{\"content\": \"🚨 La construction de l'image Docker du site a échoué ! @everyone\"}" \
              ${{ secrets.DISCORD_WEBHOOK }}
