name: Deploy React Vite to o2switch

on:
  push:
    branches:
      - main # branche à déployer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: 🚚 Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3️⃣ Installer dépendances
      - name: ⬇️ Install dependencies
        run: npm install

      # 4️⃣ Build Vite
      - name: 🏗️ Build project
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.BASE_PATH }} # utilisé dans vite.config.js si nécessaire

      # 5️⃣ Ajouter .htaccess pour SPA
      - name: ➕ Add .htaccess
        run: |
          BASE=${{ secrets.BASE_PATH }}
          cat > dist/.htaccess <<EOL
          RewriteEngine On
          RewriteBase ${BASE}
          RewriteRule ^index\\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . ${BASE}index.html [L]
          EOL

      # 6️⃣ Déployer via FTP
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/***
          server-dir: ${{ secrets.FTP_PATH }} # ex: /public_html/ ou /aymeric/
          delete: true
          dry-run: false

      # 7️⃣ Envoyer un message Discord
      - name: 💬 Discord Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "🚀 Une nouvelle version du site vient d'être déployée !"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
      - name: 💬 Discord Notification
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "⚠ Il y a une erreur avec le workflow de déploiement ! @everyone"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
