name: Build Content Studio image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # L'image embarque un instantané du contenu : elle est reconstruite quand
      # l'outil change, mais aussi quand une fiche est ajoutée ou modifiée.
      - "tools/content-studio/**"
      - "src/content/**"
      - ".github/workflows/content-studio-image.yml"

concurrency:
  group: content-studio-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms d'image en minuscules.
      - name: 🔤 Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aylabs-content-studio" >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
          labels: |
            org.opencontainers.image.title=AyLabs Content Studio
            org.opencontainers.image.description=Outil de gestion du contenu du site AyLabs

      # Le contexte est la racine du dépôt : le Dockerfile a besoin de src/content.
      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/content-studio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Summary
        run: |
          {
            echo "### Image publiée"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:latest"
            echo '```'
            echo ""
            echo "Tags :"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
